<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in – TraderWatch</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
[hidden]{display:none!important}
.box{max-width:440px;margin:56px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
.box h1{font-size:2rem;margin-bottom:18px}
#turnstileWrap{display:flex;justify-content:center;margin:6px 0 12px}
#cf-turnstile{display:flex;justify-content:center}
#cf-turnstile iframe{margin:0 auto}
.signin-note{background:var(--panel2,#f4f6f8);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:0 0 18px;font-size:14px;color:var(--text,#17171d)}
.signin-note p{margin:0}
.signin-note p.sub{margin-top:6px;color:var(--muted);font-size:13px}
.signin-note details{margin-top:9px}
.signin-note summary{cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600}
.signin-note ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:12.5px;display:grid;gap:5px}
.alt{margin-top:18px;color:var(--muted);display:grid;gap:8px}
.linkbtn{background:none;border:0;color:var(--muted);font:600 1rem var(--body);cursor:pointer;text-decoration:underline;padding:0;text-align:left}
.oauth{display:grid;gap:10px;margin-bottom:18px}
.oauth-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 1rem var(--body);cursor:pointer;transition:background .15s ease,border-color .15s ease}
.oauth-btn:hover{background:var(--fill,#f5f5f7);border-color:var(--muted)}
.oauth-btn svg{width:18px;height:18px;flex:0 0 auto}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem;margin:0 0 18px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* Telegram fullscreen: pad by the insets the client reports. Zero in a
   normal browser, so nothing changes there. */
:root[data-tg="1"] .top{padding-top:calc(12px + var(--tg-top,0px))}
:root[data-tg="1"] body{padding-bottom:calc(76px + var(--tg-bottom,0px))}
:root[data-tg="1"] .tabbar{bottom:calc(10px + var(--tg-bottom,0px))}
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="logo" href="index.html" aria-label="TraderWatch home">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#050b14" stroke="#264261"/><path d="M8 9h16v4h-6.2v11h-3.6V13H8z" fill="#fff"/><rect x="20" y="20" width="5" height="5" fill="#2ecf6f"/></svg>
      <span>TraderWatch</span></a>
    <button data-sound-toggle type="button" aria-label="Toggle sound" style="margin-left:auto;background:none;border:1px solid var(--line);border-radius:9px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted);cursor:pointer"></button>
  </div>
</header>
<main class="wrap">
  <div class="box">
    <h1 id="formTitle">Log in</h1>
    <p id="formHint" class="muted" style="margin:-10px 0 18px">Welcome back. Log in to continue.</p>
    <div class="oauth">
      <button class="oauth-btn" type="button" id="googleBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A11 11 0 0 0 12 1 11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38z"/></svg>
        Continue with Google
      </button>
      <button class="oauth-btn" type="button" id="githubBtn">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1a11 11 0 0 0-3.48 21.44c.55.1.75-.24.75-.53v-1.85c-3.06.67-3.71-1.47-3.71-1.47-.5-1.28-1.22-1.62-1.22-1.62-1-.68.08-.67.08-.67 1.1.08 1.68 1.13 1.68 1.13.98 1.68 2.57 1.2 3.2.92.1-.71.38-1.2.7-1.47-2.44-.28-5.01-1.22-5.01-5.43 0-1.2.43-2.18 1.13-2.95-.11-.28-.49-1.4.11-2.91 0 0 .92-.3 3.02 1.13a10.5 10.5 0 0 1 5.5 0c2.1-1.42 3.02-1.13 3.02-1.13.6 1.51.22 2.63.11 2.91.7.77 1.13 1.75 1.13 2.95 0 4.22-2.58 5.15-5.03 5.42.4.34.75 1 .75 2.02v3c0 .29.2.63.76.52A11 11 0 0 0 12 1z"/></svg>
        Continue with GitHub
      </button>
    </div>
    <div class="divider"><span>or with email</span></div>
    <form id="loginForm" novalidate>
      <label id="nameWrap" hidden>Full name
        <input name="name" type="text" autocomplete="name">
      </label>
      <label id="confirmWrap" hidden>Confirm password
        <input name="confirm" type="password" autocomplete="new-password">
      </label>
      <label>Email
        <input name="email" type="email" autocomplete="email" required>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <div id="turnstileWrap" style="margin:6px 0 12px"><div id="cf-turnstile"></div></div>
      <button class="btn" type="submit" id="submitBtn" disabled>Log in</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <button class="linkbtn" type="button" id="resend" hidden>Resend verification email</button>
      <small id="resendTimer" class="muted" hidden></small>
    </form>
    <div class="alt">
      <button class="linkbtn" type="button" id="forgot">Forgot your password?</button>
      <button class="linkbtn" type="button" id="otpBtn">Sign in without a password — email me a link</button>
      <span id="modeToggle">New here? <a href="login.html?mode=signup">Create a free account</a></span>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script src="common.js?v=202610182133"></script>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
/* ===== Telegram Mini App bootstrap =====
   Outside Telegram this file does nothing: window.Telegram is undefined and
   every guard below returns early. */
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  /* telegram-web-app.js defines window.Telegram even in a normal browser, so
     presence is not proof. Outside Telegram the platform is "unknown" and
     initData is empty — treat that as a plain web visit and do nothing. */
  if(!tg) return;
  var inTelegram = (tg.platform && tg.platform !== "unknown") || (tg.initData && tg.initData.length > 0);
  if(!inTelegram) return;

  var root = document.documentElement;
  root.setAttribute("data-tg", "1");

  /* Fullscreen removes the app name and the kebab menu. The close button
     stays: Telegram does not expose a way to hide it, and it is the user's
     only way out. */
  try{ tg.ready(); }catch(_){}
  try{ tg.expand(); }catch(_){}
  function goFull(){
    if(typeof tg.requestFullscreen === "function" && !tg.isFullscreen){
      try{ tg.requestFullscreen(); }catch(_){}
    }
  }
  goFull();

  /* Telegram reports insets in px. Mirror them into CSS variables so the
     sticky header and the floating tab bar do not slide under the status
     bar or the close button. */
  function applyInsets(){
    var sa = tg.safeAreaInset || {}, cs = tg.contentSafeAreaInset || {};
    var top = Math.max(sa.top || 0, cs.top || 0);
    var bottom = Math.max(sa.bottom || 0, cs.bottom || 0);
    root.style.setProperty("--tg-top", top + "px");
    root.style.setProperty("--tg-bottom", bottom + "px");
  }
  applyInsets();
  try{
    tg.onEvent("safeAreaChanged", applyInsets);
    tg.onEvent("contentSafeAreaChanged", applyInsets);
    tg.onEvent("fullscreenChanged", function(){
      applyInsets();
      if(!tg.isFullscreen) goFull();
    });
  }catch(_){}

  /* Keep the page in sync with Telegram's light/dark setting unless the
     member already chose a theme with our own toggle. */
  try{
    var forced = null;
    try{ forced = localStorage.getItem("tw_theme"); }catch(_){}
    if(!forced && tg.colorScheme){
      document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
    }
    if(tg.setHeaderColor){
      var dark = (document.documentElement.dataset.theme || tg.colorScheme) === "dark";
      tg.setHeaderColor(dark ? "#000000" : "#f5f5f7");
      tg.setBackgroundColor(dark ? "#000000" : "#f5f5f7");
    }
  }catch(_){}
})();
</script>

<script>
const form = document.getElementById("loginForm"), msg = document.getElementById("msg");
const resend = document.getElementById("resend"), resendTimer = document.getElementById("resendTimer");
let resendEmail = "", resendCooldown = null;
const signup = new URLSearchParams(location.search).get("mode") === "signup";
const title = document.getElementById("formTitle"), hint = document.getElementById("formHint");
const nameWrap = document.getElementById("nameWrap"), confirmWrap = document.getElementById("confirmWrap");
const passwordInput = form.elements.password, submitButton = form.querySelector('button[type="submit"]');
function show(t, ok){ msg.textContent = t; msg.className = "msg " + (ok ? "ok" : "err"); if(window.TWSound && ok===false) TWSound.play('error'); }
/* ---- Cloudflare Turnstile gate (anti-bot) ----
   Real widget (managed). Token dihantar terus ke Supabase sebagai captchaToken
   (Supabase enforce di server). JANGAN pre-verify di backend kita: token
   Turnstile single-use — siteverify kedua akan gagal. */
const TURNSTILE_SITEKEY = "0x4AAAAAAGLylBqIwcPYBksV";
let turnstileToken = null, turnstileReady = false, turnstileWidget = null;
function setSubmit(on){ submitButton.disabled = !on; }
function renderTurnstile(){
  if(!window.turnstile || turnstileWidget != null) return;
  turnstileReady = true;
  turnstileWidget = window.turnstile.render("#cf-turnstile", {
    sitekey: TURNSTILE_SITEKEY,
    theme: "auto",
    callback: function(token){
      turnstileToken = token; setSubmit(true);
    },
    "expired-callback": function(){ turnstileToken = null; setSubmit(false); },
    "error-callback": function(){ turnstileToken = null; setSubmit(false); }
  });
}
(function waitTurnstile(){
  if(window.turnstile){ renderTurnstile(); return; }
  if(!window.__tsTries) window.__tsTries = 0;
  if(++window.__tsTries > 30){ // ~6s: CF blocked/offline -> graceful fallback
    setSubmit(true);
    var w = document.getElementById("turnstileWrap");
    if(w) w.innerHTML = '<small class="muted">Human check unavailable — you can still sign in.</small>';
    return;
  }
  setTimeout(waitTurnstile, 200);
})();
function resetTurnstile(){
  turnstileToken = null;
  if(turnstileReady){ setSubmit(false); try{window.turnstile.reset(turnstileWidget)}catch(_){} }
}
// Beacon diagnostik (metadata sahaja, TIADA credential) + pengesanan browser
// dalam aplikasi (Telegram/WhatsApp/chat = storage sementara → loop login).
function twBeacon(event, detail){
  try {
    fetch(CONFIG.supabaseUrl + "/rest/v1/auth_diag", {
      method: "POST", keepalive: true,
      headers: { "Content-Type": "application/json", apikey: CONFIG.supabaseKey, Authorization: "Bearer " + CONFIG.supabaseKey, Prefer: "return=minimal" },
      body: JSON.stringify({ event: event, detail: detail || {} })
    }).catch(()=>{});
  } catch(_){}
}
function twInApp(){
  const ua = navigator.userAgent || "";
  if(/Telegram|WhatsApp|Instagram|FBAN|FBAV|Line\/|Twitter|MicroMessenger|Snapchat/i.test(ua)) return true;
  if(/; wv\)/.test(ua)) return true;
  if(/iPhone|iPad|iPod/.test(ua) && /AppleWebKit/.test(ua) && !/Safari\/|CriOS|FxiOS|EdgiOS/.test(ua)) return true;
  return false;
}
function setMode(isSignup){
  title.textContent = isSignup ? "Create your account" : "Log in";
  hint.textContent = isSignup ? "Sign up for free to access your TraderWatch account." : "Welcome back. Log in to continue.";
  nameWrap.hidden = !isSignup; nameWrap.querySelector('input').required = isSignup;
  confirmWrap.hidden = !isSignup; confirmWrap.querySelector('input').required = isSignup;
  passwordInput.autocomplete = isSignup ? "new-password" : "current-password";
  submitButton.textContent = isSignup ? "Create account" : "Log in";
  document.getElementById("forgot").hidden = isSignup;
  document.getElementById("modeToggle").innerHTML = isSignup
    ? 'Already have an account? <a href="login.html">Log in</a>'
    : 'New here? <a href="login.html?mode=signup">Create a free account</a>';
}
setMode(signup);
// Clean, calm sign-in notice. The verbose login-loop diagnostics were removed
// once the cross-origin session bug was fixed; detailed help is tucked behind
// a collapsed "Trouble signing in?" toggle so it never alarms normal users.
(function(){
  const p = new URLSearchParams(location.search);
  const why = p.get('why') || (p.get('err') === 'storage' ? 'storage' : '');
  const bounced = p.get('bounce') === '1' || !!why;
  const inApp = twInApp();
  if (!bounced && !inApp) return;
  let msg;
  if (why === 'storage') msg = 'Your browser is blocking site data. Enable cookies for traderwatch.org, then sign in again.';
  else if (why === 'signedout') msg = 'Your session has ended. Please sign in again to continue.';
  else msg = 'Please sign in to continue to the member area.';
  const extra = inApp ? 'For lasting access, open this page in your browser (tap ⋯ → "Open in Safari/Chrome").' : '';
  const note = document.createElement('div');
  note.className = 'signin-note';
  note.innerHTML = '<p>' + msg + '</p>' + (extra ? '<p class="sub">' + extra + '</p>' : '') +
    '<details><summary>Trouble signing in?</summary><ul>' +
    '<li>Use a regular tab, not Incognito / Private.</li>' +
    '<li>Allow cookies for traderwatch.org (turn off "clear cookies on exit").</li>' +
    '<li>Best: install the app (Chrome ⋮ → "Install app") and sign in once.</li>' +
    '</ul></details>';
  document.querySelector('.box').insertBefore(note, document.getElementById('loginForm'));
  if (inApp) twBeacon('login_inapp_seen', { ua: (navigator.userAgent||'').slice(0,220), bounced: bounced });
})();
// The login page must always show the credential form. Never auto-enter an
// existing session from here: on a shared browser that would silently open
// whoever was signed in before. A successful login replaces the old session.
// The custom domain and member portal are separate origins, so pass the
// short-lived Supabase session in the URL fragment; the member app consumes it
// client-side and the fragment is never sent to Caddy.
function sessionSaved(){
  // Sahkan session BETUL-BETUL tersimpan sebelum navigasi. Jika pelayar
  // menyekat storage, supabase fallback ke memory → session hilang semasa
  // navigasi → loop login. Tangkap di sini dengan mesej jelas.
  try {
    const k = 'sb-' + new URL(CONFIG.supabaseUrl).hostname.split('.')[0] + '-auth-token';
    return !!localStorage.getItem(k);
  } catch(_) { return false; }
}
function goToMember(next, session){
  if(!sessionSaved()){
    twBeacon('login_storage_fail', { inApp: twInApp(), ua: (navigator.userAgent||'').slice(0,220) });
    show('Sign-in succeeded but your browser did not save the session. Turn off "Block All Cookies" / use a regular Safari/Chrome window (not private or the installed app), then try again.', false);
    return;
  }
  twBeacon('login_ok', { exp: session && session.expires_at, inApp: twInApp(), ua: (navigator.userAgent||'').slice(0,220) });
  if(window.TWSound) TWSound.play('success');
  const path = next && /^\/member(?:\/|$)/.test(next) ? next : "/member/";
  // Same origin as login (traderwatch.org): Supabase keeps the session in
  // localStorage here, so no cross-domain token handoff is needed. Sending the
  // session to member.traderwatch.org created a loop when setSession failed
  // there (different origin, no stored session) and the member page bounced
  // back to login. Keep everything on one origin.
  const base = location.origin + path;
  location.replace(base);
}

form.addEventListener("submit", async e=>{
  e.preventDefault();
  if(turnstileReady && !turnstileToken) return show("Please complete the human verification first.", false);
  const email = form.email.value.trim(), password = passwordInput.value;
  if(!/^\S+@\S+\.\S+$/.test(email)) return show("Enter a valid email address.", false);
  if(!password || password.length < 8) return show("Use a password with at least 8 characters.", false);
  if(signup && password !== form.elements.confirm.value) return show("The passwords do not match.", false);
  submitButton.disabled = true;
  try {
  const next = new URLSearchParams(location.search).get("next");
  const redirectUrl = new URL("verify.html", location.href);
  if(next && /^\/(?!\/)/.test(next)) redirectUrl.searchParams.set("next", next);
  const redirectTo = redirectUrl.href;
  const result = signup
      ? await sb.auth.signUp({ email, password, options: { data: { name: form.elements.name.value.trim() }, emailRedirectTo: redirectTo, captchaToken: turnstileToken } })
      : await sb.auth.signInWithPassword({ email, password, options: { captchaToken: turnstileToken } });
    if(result.error) { resetTurnstile(); twBeacon('login_err', { msg: result.error.message, signup: signup, inApp: twInApp(), ua: (navigator.userAgent||'').slice(0,220) }); return show(signup ? result.error.message : (/captcha/i.test(result.error.message) ? "Human verification required — reload the page and try again." : /confirm/i.test(result.error.message) ? "Confirm your email first. Check your inbox for the link." : "Wrong email or password."), false); }
    if(signup && !result.data.session && result.data.user && result.data.user.email_confirmed_at){
      const signed = await sb.auth.signInWithPassword({email, password, options:{captchaToken: turnstileToken}});
      if(signed.error) return show("Account created. Log in with your new account.", true);
      goToMember(next,result.data.session);
      return;
    }
    if(signup && !result.data.session){
      resendEmail = email;
      startResendCooldown(60);
      return show("Account created. Check your email and press the confirm button. No email after a minute? Use Resend verification email below.", true);
    }
    goToMember(next,result.data.session);
  } catch (_) { resetTurnstile(); twBeacon('login_exc', { msg: String(_).slice(0,150), inApp: twInApp() }); show("Unable to connect. Please try again.", false); }
  finally { submitButton.disabled = turnstileReady ? !turnstileToken : false; }
});

function startResendCooldown(seconds){
  if(resendCooldown) clearInterval(resendCooldown);
  resend.hidden = false; resend.disabled = true;
  resendTimer.hidden = false;
  let left = seconds;
  resendTimer.textContent = `You can resend in ${left}s.`;
  resendCooldown = setInterval(()=>{
    left -= 1;
    if(left <= 0){
      clearInterval(resendCooldown); resendCooldown = null;
      resend.disabled = false; resendTimer.hidden = true;
      resend.textContent = "Resend verification email";
      return;
    }
    resendTimer.textContent = `You can resend in ${left}s.`;
  }, 1000);
}
resend.addEventListener("click", async ()=>{
  if(!resendEmail) return show("Enter your email and create your account first.", false);
  resend.disabled = true;
  try{
    const redirectTo = new URL("verify.html", location.href).href;
    const r = await sb.auth.resend({type:"signup", email:resendEmail, options:{emailRedirectTo:redirectTo, captchaToken:turnstileToken}});
    resetTurnstile();
    if(r.error){ show("Could not resend the verification email: " + r.error.message, false); resend.disabled = false; return; }
    startResendCooldown(60);
    show("A new verification email was sent. Check your inbox and spam folder.", true);
  }catch(_){ show("Unable to resend right now. Please try again later.", false); resend.disabled = false; }
});

/* Telegram Mini App auto-login removed — Telegram service is closed. The
   login form must always render. Auto-redirecting an existing session here
   created a redirect loop with the member page's own redirect-to-login when
   the two origins disagreed on session state. Members now always see the
   form and explicitly sign in; a successful submit still calls goToMember. */

/* ===== Social login (OAuth): Google / GitHub =====
   Provider mesti diaktifkan di Supabase Auth + OAuth app didaftarkan di
   Google Cloud / GitHub. signInWithOAuth redirect ke provider, kemudian
   kembali ke verify.html yang consumir session dan membuka member area. */
async function oauthSignIn(provider){
  const next = new URLSearchParams(location.search).get("next");
  const redirectUrl = new URL("verify.html", location.href);
  if(next && /^\/(?!\/)/.test(next)) redirectUrl.searchParams.set("next", next);
  try {
    const { error } = await sb.auth.signInWithOAuth({ provider, options: { redirectTo: redirectUrl.href } });
    if(error){ twBeacon('oauth_err', { provider, msg: String(error.message).slice(0,150) });
      show("Could not start " + provider + " sign-in: " + error.message, false); }
  } catch(_) { twBeacon('oauth_exc', { provider }); show("Unable to connect. Please try again.", false); }
}
document.getElementById("googleBtn").addEventListener("click", ()=>oauthSignIn("google"));
document.getElementById("githubBtn").addEventListener("click", ()=>oauthSignIn("github"));

document.getElementById('otpBtn').addEventListener('click', async ()=>{
  const email = form.email.value.trim();
  if(!/^\S+@\S+\.\S+$/.test(email)) return show('Enter your email above first, then press the magic link button.', false);
  const next = new URLSearchParams(location.search).get("next");
  const redirectUrl = new URL("verify.html", location.href);
  if(next && /^\/(?!\/)/.test(next)) redirectUrl.searchParams.set("next", next);
  try {
    const r = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectUrl.href, captchaToken: turnstileToken } });
    resetTurnstile();
    show(r.error ? 'Could not send link: ' + r.error.message : 'Magic link sent to ' + email + ' — click the link in the email to sign in (check spam).', !r.error);
  } catch(_) { show('Unable to connect. Please try again.', false); }
});

document.getElementById("forgot").addEventListener("click", async ()=>{
  const email = form.email.value.trim();
  if(!/^\S+@\S+\.\S+$/.test(email)) return show("Enter your email above first, then press Forgot your password.", false);
  const redirectTo = location.href.replace(/[^/]*(#.*)?$/, "") + "login.html";
  try {
    const r = await sb.auth.resetPasswordForEmail(email, { redirectTo, captchaToken: turnstileToken });
    resetTurnstile();
    show(r.error ? "Could not send the reset email: " + r.error.message : "If that email has an account, a reset link is on its way.", !r.error);
  } catch (_) { show("Unable to connect. Please try again.", false); }
});
</script>
