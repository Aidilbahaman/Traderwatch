<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apple Intelligence Shimmer — Preview</title>
<meta name="theme-color" content="#0a0e0b">
<style>
/* ============================================================
   Apple Intelligence SHIMMER — nilai tepat dari Apple Design Team.
   Conic gradient mengelilingi SEMPADAN, bukan garis scan.
   Warna tetap: #0894FF -> #C959DD -> #FF2E54 -> #FF9004 -> balik.
   1.8s satu pusingan. 3 lapisan: core 2px + bloom 14px + wash 30px.
   Bernafas (line-width oscillation). Pudar 0.4s bila siap.
   ============================================================ */
@property --ai-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

:root{--bg:#0a0e0b;--card:#111612;--card2:#171e18;--text:#eef3ee;--muted:#8a978c;
  --line:#222b23;--lime:#b7f36b;--red:#ff777d;--chart:#0c110d;--onlime:#10150b;color-scheme:dark}
html[data-theme="light"]{--bg:#f5f7f5;--card:#ffffff;--card2:#eef2ed;--text:#14211a;
  --muted:#63736a;--line:rgba(0,0,0,.1);--lime:#7ab52e;--red:#d64b55;
  --chart:#f0f4ef;--onlime:#0b1405;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;
  -webkit-font-smoothing:antialiased;letter-spacing:-.011em}
.wrap{width:390px;max-width:100%}
h1{font-size:17px;letter-spacing:-.02em;margin:0 0 4px;font-weight:850}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.45}
.sheet{width:390px;max-width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:26px;padding:12px 16px 20px;box-shadow:0 -20px 60px #000a}
.grab{padding:2px 0 10px;display:flex;justify-content:center}
.grab i{display:block;width:40px;height:5px;border-radius:9px;background:var(--line)}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.shead .ic{width:42px;height:42px;border-radius:13px;background:var(--lime);color:var(--onlime);
  display:grid;place-items:center;font-weight:900;font-size:12px}
.shead h2{margin:0;font-size:20px;letter-spacing:-.04em}
.shead p{margin:0;color:var(--muted);font-size:12px}
.shead .x{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--card2);
  color:var(--muted);display:grid;place-items:center;font-size:15px;border:1px solid var(--line)}

/* ===== stage: chart dengan 3 lapisan shimmer ===== */
.stage{position:relative;margin:0 0 16px}
.ait{position:absolute;pointer-events:none;z-index:3;
  border-radius:20px;
  background:conic-gradient(from var(--ai-angle),
    #0894FF 0%, #C959DD 33%, #FF2E54 66%, #FF9004 88%, #0894FF 100%);
  /* mask: hanya tepi yang kelihatan, tengah telus */
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .4s ease}
/* 1) core tajam 2px */
.ait.core{inset:0;padding:1px;animation:aiSpin 1.8s linear infinite}
/* 2) bloom — cahaya sederhana */
.ait.bloom{inset:-3px;padding:4px;filter:blur(5px) saturate(170%);animation:aiSpin 1.8s linear infinite}
/* 3) wash — cahaya jauh, halus */
.ait.wash{inset:-8px;padding:9px;filter:blur(14px) saturate(150%);animation:aiSpin 1.8s linear infinite}
/* bernafas: line-width berayun melalui padding, bukan berputar mekanikal */
@keyframes aiSpin{to{--ai-angle:360deg}}

/* keadaan scanning */
.stage.ai .ait.core{opacity:1}
.stage.ai .ait.bloom{opacity:.55}
.stage.ai .ait.wash{opacity:.26}
/* pudar pantas 0.4s bila selesai (Apple: shimmer hilang, tinggal treatment statik) */
.stage.done .ait{opacity:0;transition:opacity .4s ease}

/* kotak chart */
.chartbox{position:relative;z-index:2;border-radius:18px;background:var(--chart);
  overflow:hidden;height:220px;border:1px solid rgba(255,255,255,.06)}
.stage.ai .chartbox{border-color:transparent}
.stage.done .chartbox{border-color:rgba(255,255,255,.10)}
#cv{display:block;width:100%;height:100%}

.chipc{position:absolute;left:11px;top:11px;z-index:3;
  display:flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:999px;
  font-size:10px;font-weight:800;letter-spacing:.08em;
  background:rgba(10,14,11,.82);border:1px solid var(--line);color:var(--muted);
  transition:all .35s ease}
.chipc i{width:6px;height:6px;border-radius:50%;background:var(--muted);transition:.35s}
.stage.ai .chipc{color:#fff;border-color:rgba(255,255,255,.26);
  background:rgba(16,20,28,.88);backdrop-filter:blur(14px)}
.stage.ai .chipc i{background:conic-gradient(from 0deg,#0894FF,#C959DD,#FF2E54,#FF9004,#0894FF);
  animation:dotSpin 1.8s linear infinite}
@keyframes dotSpin{to{transform:rotate(360deg)}}
.stage.done .chipc{color:var(--lime);border-color:rgba(183,243,107,.4)}
.stage.done .chipc i{background:var(--lime);box-shadow:0 0 8px var(--lime)}

/* butang */
.go{width:100%;padding:14px;border-radius:15px;font-weight:800;font-size:15px;border:0;
  color:var(--onlime);background:var(--lime);box-shadow:0 0 26px #b7f36b2b;cursor:pointer;
  transition:transform .12s,background .3s}
.go:active{transform:scale(.98)}
.go.ai{background:var(--card2);color:var(--muted);box-shadow:none;cursor:default}

.note{font-size:11px;color:var(--muted);line-height:1.55;margin:12px 0 0}
.note b{color:var(--text)}
.note code{font-family:ui-monospace,Menlo,monospace;font-size:10px;background:rgba(255,255,255,.08);
  padding:1px 4px;border-radius:4px}

@media (prefers-reduced-motion: reduce){
  .ait.core,.ait.bloom,.ait.wash{animation:none}
  .stage.ai .ait.core{opacity:.9}
  .stage.ai .ait.bloom{opacity:.5}
  .stage.ai .ait.wash{opacity:.28}
  .stage.done .ait{opacity:0}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Hairline + Ripple</h1>
  <p class="sub">Ombak cahaya mengembang dari tengah carta.</p>

  <div class="sheet">
    <div class="grab"><i></i></div>
    <div class="shead">
      <div class="ic">XAU</div>
      <div><h2>XAUUSD</h2><p>Gold / US Dollar · M15</p></div>
      <button class="x">✕</button>
    </div>

    <div class="stage" id="st">
      <span class="ait wash"></span>
      <span class="ait bloom"></span>
      <span class="ait core"></span>
      <div class="chartbox">
        <canvas id="cv"></canvas>
        <div class="chipc" id="chip"><i></i><span id="chipT">SEDIA</span></div>
      </div>
    </div>

    <button class="go" id="go">✦ Analyze with AI</button>
  </div>

  <p class="note"><b>Ripple</b> — ombak bulat mengembang dari tengah carta berulang kali. Candle menyala bila ombak melaluinya, kemudian pudar semula. Rasa seperti denyutan nadi pasaran.</p>
</div>


<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
  var PX=[3627,3625,3626,3622,3619,3620,3616,3612,3608,3604,3601,3603,3600,3602,3606,3609,3611,3608,3610,3613,3611,3609,3612,3615,3613,3611,3614,3617,3620,3623,3627,3625,3622,3620,3622,3621,3619,3620,3621,3620];
  var N=PX.length;
  var G={};
  function size(){
    var r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;
    G.W=cv.width;G.H=cv.height;G.pad=16;G.pT=14;G.pB=22;
    G.lo=Math.min.apply(0,PX);G.hi=Math.max.apply(0,PX);
    G.rng=(G.hi-G.lo)||1;
    G.plotW=G.W-G.pad*2;G.plotH=G.H-G.pT-G.pB;
  }
  function X(i){return G.pad+(i/(N-1))*G.plotW}
  function Y(v){return G.pT+(G.hi-v)/G.rng*G.plotH}

  function grid(){
    var muted=css('--muted');
    ctx.lineWidth=1;ctx.font='700 20px ui-monospace,Menlo,monospace';
    ctx.textAlign='left';ctx.textBaseline='middle';
    for(var g=0;g<4;g++){
      var gv=G.lo+G.rng*g/3,gy=Y(gv);
      ctx.strokeStyle='rgba(128,150,130,.10)';
      ctx.beginPath();ctx.moveTo(G.pad,gy);ctx.lineTo(G.W-G.pad,gy);ctx.stroke();
      ctx.fillStyle=muted;ctx.fillText(gv.toFixed(2),G.W-G.pad+6,gy);
    }
  }
  function candles(alphaOf){
    var lime=css('--lime'),red=css('--red');
    for(var i=0;i<N;i++){
      var a=alphaOf?alphaOf(i):1;
      if(a<=0.02)continue;
      var cx=X(i),yv=Y(PX[i]);
      ctx.globalAlpha=a;
      ctx.strokeStyle=lime;ctx.lineWidth=2.6;
      ctx.beginPath();ctx.moveTo(cx,yv-9);ctx.lineTo(cx,yv+9);ctx.stroke();
      ctx.fillStyle=lime;ctx.fillRect(cx-3,yv-5,6,10);
    }
    ctx.globalAlpha=1;
  }
  function swings(){
    for(var j=2;j<N-2;j++){
      var a=PX[j-2],b=PX[j-1],c=PX[j],e=PX[j+1],f=PX[j+2];
      if((c>b&&c>e&&b>a&&e<f)||(c<b&&c<e&&b<a&&e>f)){
        ctx.beginPath();ctx.arc(X(j),Y(c),4.4,0,6.284);
        ctx.fillStyle=c>b?'rgba(214,255,154,.85)':'rgba(255,159,159,.85)';ctx.fill();
      }
    }
  }

  /* ---- FX per variasi ---- */
  var FX=function(t){
      var cx=G.W/2, cy=G.H/2;
      candles(function(i){
        var dx=X(i)-cx, dy=Y(PX[i])-cy;
        var d=Math.sqrt(dx*dx+dy*dy);
        var phase=(t*0.55)%1.9;
        var ring=phase*230;
        var dd=Math.abs(d-ring);
        return Math.max(0.15, 1-dd/90);
      });
      // 2 cincin ombak
      for(var k=0;k<2;k++){
        var ph=((t*0.55)+k*0.95)%1.9;
        var r=ph*230;
        var al=Math.max(0,1-ph/1.9)*0.5;
        ctx.beginPath();ctx.arc(cx,cy,r,0,6.284);
        ctx.strokeStyle='rgba(183,243,107,'+al.toFixed(3)+')';
        ctx.lineWidth=2.2;ctx.stroke();
      }
    };

  function frame(){
    var t=performance.now()/1000;
    ctx.clearRect(0,0,G.W,G.H);
    grid();
    FX(t);
    swings();
    requestAnimationFrame(frame);
  }
  size();window.addEventListener('resize',size);
  requestAnimationFrame(frame);
})();
</script>
