<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Breath — natural scan</title>
<meta name="theme-color" content="#0a0e0b">
<style>
@property --ai-angle{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--bg:#0a0e0b;--card:#111612;--card2:#171e18;--text:#eef3ee;--muted:#8a978c;
  --line:#222b23;--lime:#b7f36b;--red:#ff777d;--chart:#0c110d;--onlime:#10150b;color-scheme:dark}
html[data-theme="light"]{--bg:#f5f7f5;--card:#ffffff;--card2:#eef2ed;--text:#14211a;
  --muted:#63736a;--line:rgba(0,0,0,.1);--lime:#7ab52e;--red:#d64b55;
  --chart:#f0f4ef;--onlime:#0b1405;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;
  -webkit-font-smoothing:antialiased;letter-spacing:-.011em}
.wrap{width:390px;max-width:100%}
h1{font-size:17px;letter-spacing:-.02em;margin:0 0 4px;font-weight:850}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.45}
.sheet{width:390px;max-width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:26px;padding:12px 16px 20px;box-shadow:0 -20px 60px #000a}
.grab{padding:2px 0 10px;display:flex;justify-content:center}
.grab i{display:block;width:40px;height:5px;border-radius:9px;background:var(--line)}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.shead .ic{width:42px;height:42px;border-radius:13px;background:var(--lime);color:var(--onlime);
  display:grid;place-items:center;font-weight:900;font-size:12px}
.shead h2{margin:0;font-size:20px;letter-spacing:-.04em}
.shead p{margin:0;color:var(--muted);font-size:12px}
.shead .x{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--card2);
  color:var(--muted);display:grid;place-items:center;font-size:15px;border:1px solid var(--line)}

/* border hairline — KEKAL */
.stage{position:relative;margin:0 0 16px}
.ait{position:absolute;pointer-events:none;z-index:3;border-radius:20px;
  background:conic-gradient(from var(--ai-angle),
    #0894FF 0%, #C959DD 33%, #FF2E54 66%, #FF9004 88%, #0894FF 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .5s ease}
.ait.core{inset:0;padding:1px;animation:aiSpin 1.8s linear infinite}
.ait.bloom{inset:-3px;padding:4px;filter:blur(5px) saturate(170%);animation:aiSpin 1.8s linear infinite}
.ait.wash{inset:-8px;padding:9px;filter:blur(14px) saturate(150%);animation:aiSpin 1.8s linear infinite}
@keyframes aiSpin{to{--ai-angle:360deg}}
.stage.ai .ait.core{opacity:1}
.stage.ai .ait.bloom{opacity:.55}
.stage.ai .ait.wash{opacity:.26}
.stage.done .ait{opacity:0}

.chartbox{position:relative;z-index:2;border-radius:18px;background:var(--chart);
  overflow:hidden;height:220px;border:1px solid rgba(255,255,255,.06)}
.stage.ai .chartbox{border-color:transparent}
#cv{display:block;width:100%;height:100%}

.chipc{position:absolute;left:11px;top:11px;z-index:3;display:flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.08em;
  background:rgba(10,14,11,.82);border:1px solid var(--line);color:var(--muted);
  transition:all .4s ease}
.chipc i{width:6px;height:6px;border-radius:50%;background:var(--muted);transition:.4s}
.stage.ai .chipc{color:#e8f3e2;border-color:rgba(255,255,255,.20);background:rgba(14,20,16,.9)}
.stage.ai .chipc i{background:#cfe8bd;animation:soft 2.6s ease-in-out infinite}
@keyframes soft{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
.stage.done .chipc{color:var(--lime);border-color:rgba(183,243,107,.32)}
.stage.done .chipc i{background:var(--lime)}

.go{width:100%;padding:14px;border-radius:15px;font-weight:800;font-size:15px;border:0;
  color:var(--onlime);background:var(--lime);box-shadow:0 0 26px #b7f36b2b;cursor:pointer;
  transition:transform .12s,background .35s,color .35s}
.go:active{transform:scale(.98)}
.go.ai{background:var(--card2);color:var(--muted);box-shadow:none;cursor:default}

.note{font-size:11px;color:var(--muted);line-height:1.6;margin:12px 0 0}
.note b{color:var(--text)}
@media (prefers-reduced-motion:reduce){
  .ait.core,.ait.bloom,.ait.wash{animation:none}
  .stage.ai .ait.core{opacity:.9}.stage.ai .ait.bloom{opacity:.5}.stage.ai .ait.wash{opacity:.25}
  .stage.done .ait{opacity:0}
}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="h1">Hairline + Sand</h1>
  <p class="sub" id="sub"><span>Zarah halus hanyut perlahan, tiada arah.</span></p>

  <div class="sheet">
    <div class="grab"><i></i></div>
    <div class="shead">
      <div class="ic">XAU</div>
      <div><h2>XAUUSD</h2><p>Gold / US Dollar · M15</p></div>
      <button class="x">✕</button>
    </div>

    <div class="stage" id="st">
      <span class="ait wash"></span>
      <span class="ait bloom"></span>
      <span class="ait core"></span>
      <div class="chartbox">
        <canvas id="cv"></canvas>
        <div class="chipc" id="chip"><i></i><span id="chipT">SEDIA</span></div>
      </div>
    </div>

    <button class="go" id="go">✦ Analyze with AI</button>
  </div>

  <p class="note"><b>Sand</b> — 26 zarah halus hanyut perlahan ke kanan-atas seperti habuk dalam cahaya. Sangat kecil dan malap. Ia mengisi ruang dengan kehidupan tanpa menarik perhatian.</p>
</div>

<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
  function rgba(r,g,b,a){return 'rgba('+r+','+g+','+b+','+a+')'}
  var PX=[3627,3625,3626,3622,3619,3620,3616,3612,3608,3604,3601,3603,3600,3602,3606,3609,3611,3608,3610,3613,3611,3609,3612,3615,3613,3611,3614,3617,3620,3623,3627,3625,3622,3620,3622,3621,3619,3620,3621,3620];
  var N=PX.length,G={},PT=[],LEN=[],TOTAL=0;
  function size(){
    var r=cv.getBoundingClientRect();
    cv.width=Math.round(r.width*2);cv.height=Math.round(r.height*2);
    G.W=cv.width;G.H=cv.height;G.pad=16;G.pT=14;G.pB=22;
    G.lo=Math.min.apply(0,PX);G.hi=Math.max.apply(0,PX);G.rng=(G.hi-G.lo)||1;
    G.plotW=G.W-G.pad*2;G.plotH=G.H-G.pT-G.pB;
    PT=[];LEN=[];TOTAL=0;
    for(var i=0;i<N;i++){
      var x=G.pad+(i/(N-1))*G.plotW;
      var y=G.pT+(G.hi-PX[i])/G.rng*G.plotH;
      PT.push({x:x,y:y});
      if(i>0){var dx=PT[i].x-PT[i-1].x,dy=PT[i].y-PT[i-1].y;TOTAL+=Math.sqrt(dx*dx+dy*dy)}
      LEN.push(TOTAL);
    }
  }
  function at(s){
    if(s<=0)return PT[0];if(s>=TOTAL)return PT[N-1];
    for(var i=1;i<N;i++){if(LEN[i]>=s){
      var f=(s-LEN[i-1])/((LEN[i]-LEN[i-1])||1);
      return {x:PT[i-1].x+(PT[i].x-PT[i-1].x)*f,y:PT[i-1].y+(PT[i].y-PT[i-1].y)*f};
    }}
    return PT[N-1];
  }
  function grid(){
    var mu=css('--muted');
    ctx.lineWidth=1;ctx.font='700 20px ui-monospace,Menlo,monospace';
    ctx.textAlign='left';ctx.textBaseline='middle';
    for(var g=0;g<4;g++){
      var gv=G.lo+G.rng*g/3,gy=G.pT+(G.hi-gv)/G.rng*G.plotH;
      ctx.strokeStyle='rgba(128,150,130,.09)';
      ctx.beginPath();ctx.moveTo(G.pad,gy);ctx.lineTo(G.W-G.pad,gy);ctx.stroke();
      ctx.fillStyle=mu;ctx.fillText(gv.toFixed(2),G.W-G.pad+6,gy);
    }
  }
  function path(){
    ctx.beginPath();
    for(var i=0;i<N;i++){i?ctx.lineTo(PT[i].x,PT[i].y):ctx.moveTo(PT[i].x,PT[i].y)}
  }
  function swings(){
    for(var j=2;j<N-2;j++){
      var a=PX[j-2],b=PX[j-1],c=PX[j],e=PX[j+1],f=PX[j+2];
      if((c>b&&c>e&&b>a&&e<f)||(c<b&&c<e&&b<a&&e>f)){
        ctx.beginPath();ctx.arc(PT[j].x,PT[j].y,4.2,0,6.284);
        ctx.fillStyle=c>b?'rgba(214,255,154,.55)':'rgba(255,159,159,.55)';ctx.fill();
      }
    }
  }
  var DRAW=function(t){
    path();
    ctx.strokeStyle=css('--lime');ctx.lineWidth=3.1;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
    /* zarah halus melayang, hanyut perlahan ke kanan-atas */
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(var k=0;k<26;k++){
      var seed=(k*0.6180339887)%1;
      var sy=(k*0.381966)%1;
      var px=G.pad+((seed+t*0.018)%1)*G.plotW;
      var py=G.pT+((sy-t*0.010+4)%1)*G.plotH;
      var a=0.10+0.14*Math.sin(t*0.6+k);
      var R=G.plotW*0.006+(k%3)*G.plotW*0.003;
      var g=ctx.createRadialGradient(px,py,0,px,py,R*3);
      g.addColorStop(0,rgba(236,255,214,Math.max(0,a).toFixed(3)));
      g.addColorStop(1,rgba(200,240,170,0));
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,R*3,0,6.284);ctx.fill();
    }
    ctx.restore();
  };
  function frame(){
    var t=performance.now()/1000;
    ctx.clearRect(0,0,G.W,G.H);
    grid();
    DRAW(t);
    swings();
    requestAnimationFrame(frame);
  }
  size();window.addEventListener('resize',size);
  requestAnimationFrame(frame);
  var st=document.getElementById('st'),chipT=document.getElementById('chipT'),go=document.getElementById('go');
  function on(){st.classList.add('ai');st.classList.remove('done');
    chipT.textContent='AI SCANNING';go.classList.add('ai');go.textContent='Reading the chart\u2026'}
  function off(){st.classList.remove('ai');st.classList.add('done');
    chipT.textContent='ANALYSIS READY';go.classList.remove('ai');go.textContent='\u2726 Analyze with AI'}
  function loop(){on();setTimeout(function(){off();setTimeout(loop,1600)},6000)}
  loop();
  go.onclick=function(){off();setTimeout(loop,300)};
})();
</script>
