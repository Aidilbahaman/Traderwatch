<!doctype html><html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z5 — Candle Cascade</title>
<style>
:root{--lime:#b7f36b;--card:#111612;--card2:#171e18;--line:#222b23;--muted:#8a978c;--text:#eef3ee;--onlime:#10150b;--red:#ff777d}
*{box-sizing:border-box;margin:0}
body{background:#0a0e0b;color:var(--text);font:14px -apple-system,sans-serif}
.hint{position:fixed;top:0;left:0;right:0;z-index:999;background:#171e18dd;color:var(--muted);font-size:10.5px;padding:8px 14px;text-align:center;border-bottom:1px solid var(--line)}
.hint b{color:var(--lime)}
.replay{position:fixed;bottom:14px;right:14px;z-index:999;background:var(--card2);border:1px solid var(--line);color:var(--lime);font:700 10px inherit;padding:8px 14px;border-radius:99px;cursor:pointer}
.phone{width:390px;max-width:100%;height:800px;max-height:100vh;margin:0 auto;position:relative;overflow:hidden;background:#050807}
#intro{position:absolute;inset:0;z-index:10;display:grid;place-items:center;cursor:pointer;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#0e150f,#030604 75%)}
.brand{position:absolute;top:60px;font-size:12px;font-weight:900;letter-spacing:2px;color:var(--lime);z-index:7;transition:opacity .2s}
.brand span{color:var(--text)}
/* candle ring around core */
.candles{position:absolute;width:300px;height:300px;z-index:4}
.candles .cd{position:absolute;left:50%;top:50%;width:5px;border-radius:2px;transform-origin:50% 150px}
.bh{position:relative;width:200px;height:200px;display:grid;place-items:center;z-index:5}
.bh .core{position:relative;width:70px;height:70px;border-radius:50%;background:#000;z-index:6;
 box-shadow:0 0 0 2px var(--lime),0 0 36px 12px #b7f36baa,0 0 100px 34px #b7f36b44;animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.bh .wv{position:absolute;width:100px;height:100px;border-radius:50%;border:1px solid #b7f36b88;animation:wv 3s ease-out infinite}
.bh .wv.b{animation-delay:1s}.bh .wv.c{animation-delay:2s}
@keyframes wv{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.5);opacity:0}}
.itxt{position:absolute;bottom:140px;text-align:center;z-index:7;padding:0 30px;transition:opacity .2s,transform .4s}
.itxt b{display:block;font-size:24px;font-weight:900}.itxt small{display:block;color:var(--muted);font-size:11.5px;margin-top:8px}
.tap{position:absolute;bottom:44px;font-size:10.5px;color:var(--lime);font-weight:800;letter-spacing:1px;animation:bl 1.6s infinite;z-index:7}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
/* zoom: candles fall inward */
#intro.go .candles{animation:candSpin 1.5s cubic-bezier(.35,0,.65,1) forwards}
@keyframes candSpin{0%{transform:rotate(0) scale(1);opacity:1}100%{transform:rotate(-540deg) scale(.03);opacity:0}}

@keyframes bhZoom{0%{transform:scale(1)}30%{transform:scale(1.5)}65%{transform:scale(4)}100%{transform:scale(16)}}
#intro.go .brand,#intro.go .tap{opacity:0}
#intro.go .itxt{opacity:0;transform:translateY(40px)}
/* price line sweep */
#pline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--lime),transparent);z-index:6;opacity:0;top:50%}
#intro.go #pline{animation:psweep 1.4s ease-in-out forwards}
@keyframes psweep{0%{opacity:0;transform:scaleX(0)}30%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1.4)}}
#void{position:absolute;inset:0;z-index:15;background:#000;opacity:0;transition:opacity .25s}
#void.on{opacity:1}
#on{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(4,8,5,.9);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .5s}
#on.show{opacity:1;pointer-events:auto}
.card{width:100%;max-width:360px;background:var(--card);border:1px solid #b7f36b3d;border-radius:24px;padding:24px 20px 18px;text-align:center;transform:scale(.86);transition:transform .55s cubic-bezier(.2,1.3,.4,1)}
#on.show .card{transform:scale(1)}
.clogo{font-size:12px;font-weight:900;color:var(--lime);margin-bottom:14px}.clogo span{color:var(--text)}
.mini{width:62px;height:62px;margin:0 auto 14px;border-radius:50%;background:#000;box-shadow:0 0 0 1.5px var(--lime),0 0 18px 5px #b7f36b77;animation:beat 3s ease-in-out infinite}
.ct{font-size:20px;font-weight:900}.cs{font-size:11px;color:var(--muted);margin:6px 0 18px}
.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px;color:var(--text);font:inherit;cursor:pointer}
.oi{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:#b7f36b18;color:var(--lime)}
.ot{flex:1;display:flex;flex-direction:column;gap:2px}.ot b{font-size:12px;font-weight:800}.ot small{font-size:9.5px;color:var(--muted)}
.go{width:100%;border:0;border-radius:13px;padding:13px;font:800 12.5px inherit;cursor:pointer;background:linear-gradient(135deg,var(--lime),#8ed94e);color:var(--onlime);margin-top:7px}
.sk{display:block;margin:10px auto 0;border:0;background:none;color:var(--muted);cursor:pointer;font:600 10.5px inherit;text-decoration:underline}
.zlabel{position:absolute;z-index:30;top:50%;left:50%;transform:translate(-50%,-50%);color:#b7f36b;font:900 20px monospace;letter-spacing:3px;opacity:0;pointer-events:none;text-shadow:0 0 20px #b7f36b}
#intro.go .zlabel{animation:zlbl 1.6s ease-out forwards}
@keyframes zlbl{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
#intro.go .bh,#intro.go .candles{transform:none}}
</style></head><body>
<div class="hint"><b>Z5 Candle Cascade</b> — candlestick hijau/merah mengelilingi core, jatuh spiral masuk. 🔊 Bunyi "tick-tick data + bass drop"</div>
<button class="replay" onclick="location.reload()">↻ Replay</button>
<div class="phone">
 <div id="intro">
  <div class="brand">✦ <span>TraderWatch</span></div>
  <div class="candles" id="candles"></div>
  <div id="pline"></div>
  <div class="bh"><div class="wv"></div><div class="wv b"></div><div class="wv c"></div><div class="core"></div></div>
  <div class="itxt"><b>Every candle counts.</b><small>Setiap lilin data menuju satu keputusan.</small></div>
  <div class="tap">TEKAN UNTUK MASUK →</div>
  <div class="zlabel">ENTERING…</div>
 </div>
 <div id="void"></div>
 <div id="on"><div class="card">
  <div class="clogo">✦ <span>TraderWatch</span></div><div class="mini"></div>
  <div class="ct">Selamat datang!</div><div class="cs">Sediakan app anda sebelum mula.</div>
  <button class="opt"><span class="oi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/></svg></span><span class="ot"><b>Hidupkan notifikasi</b><small>Alert TP/SL</small></span></button>
  <button class="opt"><span class="oi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/></svg></span><span class="ot"><b>Tambah ke skrin utama</b><small>Buka macam app</small></span></button>
  <button class="go">Mula trade →</button><button class="sk">Langkau dulu</button>
 </div></div>
</div>
<script>
var AC=null;function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function candleSound(){
 var c=ac(),t=c.currentTime;
 /* tick-tick data (short blips accelerating) */
 for(var i=0;i<14;i++){
  var o=c.createOscillator();o.type='square';
  o.frequency.value=700+Math.random()*900;
  var g=c.createGain();var tt=t+i*.045;
  g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(.05,tt+.005);g.gain.exponentialRampToValueAtTime(.001,tt+.06);
  o.connect(g).connect(c.destination);o.start(tt);o.stop(tt+.07);
 }
 /* bass drop */
 var s=c.createOscillator();s.type='sine';s.frequency.setValueAtTime(120,t);s.frequency.exponentialRampToValueAtTime(32,t+.85);
 var sg=c.createGain();sg.gain.setValueAtTime(.0001,t);sg.gain.exponentialRampToValueAtTime(.5,t+.1);sg.gain.exponentialRampToValueAtTime(.001,t+1.1);
 s.connect(sg).connect(c.destination);s.start(t);s.stop(t+1.15);
 /* whoosh */
 var n=c.createBufferSource(),b=c.createBuffer(1,c.sampleRate*.9,c.sampleRate),d=b.getChannelData(0);
 for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=b;
 var bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=1;
 bp.frequency.setValueAtTime(300,t);bp.frequency.exponentialRampToValueAtTime(3000,t+.7);
 var ng=c.createGain();ng.gain.setValueAtTime(.001,t);ng.gain.exponentialRampToValueAtTime(.2,t+.1);ng.gain.exponentialRampToValueAtTime(.001,t+.9);
 n.connect(bp).connect(ng).connect(c.destination);n.start(t);n.stop(t+.95);
}

/* ===== JS-DRIVEN ZOOM (bukan CSS animation — works even with Reduce Motion) ===== */
function jsZoom(el,max,dur,onDone){
 var t0=null;
 function step(ts){
  if(t0===null)t0=ts;
  var p=Math.min(1,(ts-t0)/dur);
  var e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  var sc=1+e*(max-1);
  el.style.transform='scale('+sc.toFixed(3)+')';
  if(p<1)requestAnimationFrame(step);else if(onDone)onDone();
 }
 requestAnimationFrame(step);
}
(function(){
 var cd=document.getElementById('candles'),N=28;
 for(var i=0;i<N;i++){
  var el=document.createElement('div');el.className='cd';
  var h=14+Math.random()*46;
  el.style.height=h+'px';
  el.style.background=Math.random()>.4?'var(--lime)':'var(--red)';
  el.style.boxShadow='0 0 8px '+(Math.random()>.4?'#b7f36b99':'#ff777d99');
  el.style.transform='rotate('+(i/N*360)+'deg) translateY(-150px)';
  el.style.opacity=(0.5+Math.random()*0.5).toFixed(2);
  cd.appendChild(el);
 }
 var intro=document.getElementById('intro'),busy=false;
 intro.onclick=function(){
  if(busy)return;busy=true;
  try{candleSound}catch(e){}
  intro.classList.add('go');
  var zoomEl=document.querySelector('.bh');
  jsZoom(zoomEl,16,1800,function(){
   document.getElementById('void').classList.add('on');
   setTimeout(function(){
    intro.style.display='none';
    document.getElementById('on').classList.add('show');
    setTimeout(function(){var v=document.getElementById('void');v.style.transition='opacity .6s';v.classList.remove('on')},120);
   },260);
  });
 };
})();
</script></body></html>
