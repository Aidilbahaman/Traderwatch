<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraderWatch — Pair Card AI Ticker</title>
<style>
:root{--bg:#0a0e0b;--card:#111612;--card2:#171e18;--line:#222b23;--text:#eef3ee;--muted:#8a978c;
 --lime:#b7f36b;--lime2:#d6ff9a;--red:#ff777d;--orange:#ffc16b;--blue:#8ab4ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:26px 16px 60px}
h1{font-size:20px;font-weight:800;text-align:center;margin-bottom:6px}
.sub{color:var(--muted);font-size:12px;text-align:center;line-height:1.6;margin-bottom:8px;max-width:520px;margin-left:auto;margin-right:auto}
.variants{max-width:560px;margin:0 auto 26px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.vbtn{background:var(--card2);border:1px solid var(--line);color:var(--muted);font:700 10.5px inherit;
 padding:8px 14px;border-radius:99px;cursor:pointer;letter-spacing:.06em}
.vbtn.on{background:#b7f36b18;border-color:#b7f36b66;color:var(--lime)}
.grid{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* ===== PAIR CARD (sama macam app) ===== */
.pair{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--card);
 border:1px solid var(--line);border-radius:16px;padding:11px 12px 10px;text-align:left;cursor:pointer;
 transition:border-color .2s,transform .15s;overflow:hidden}
.pair:active{transform:scale(.985)}
.pair:hover{border-color:#34452f}
.pair .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pair .ic{width:26px;height:26px;border-radius:8px;background:#b7f36b1a;border:1px solid #b7f36b33;
 display:grid;place-items:center;font:800 9.5px inherit;color:var(--lime);letter-spacing:.03em;flex:none}
.pair .nm{font-size:13.5px;font-weight:850;letter-spacing:-.02em}
.pair .ds{font-size:10px;color:var(--muted);margin-top:-3px}
.pair .px{font-size:16px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin-top:2px}
.pair .ch{font-size:10px;font-weight:800;display:flex;align-items:center;gap:5px}
.pair .ch.up{color:var(--lime)}
.pair .ch.dn{color:var(--red)}
.pair .closed-tag{font-size:8px;font-weight:800;letter-spacing:.06em;color:var(--muted);
 background:var(--card2);border:1px solid var(--line);padding:2px 6px;border-radius:99px}
.pair.closed{opacity:.55}
.pair .spark{width:62px;height:22px;flex:none}
.pair .traders{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:800;
 color:var(--orange);background:#ffc16b14;border:1px solid #ffc16b33;border-radius:99px;padding:2px 7px}

/* ===== AI TICKER — Variant A: chip kecil di bawah ===== */
.ai-tick{display:inline-flex;align-items:center;gap:5px;font-size:8.5px;font-weight:800;
 color:var(--blue);background:#8ab4ff10;border:1px solid #8ab4ff2e;border-radius:99px;
 padding:2.5px 7px;letter-spacing:.03em;width:fit-content}
.ai-tick .d{width:4px;height:4px;border-radius:50%;background:var(--blue);
 box-shadow:0 0 6px var(--blue);animation:tickPulse 2s ease-in-out infinite}
@keyframes tickPulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
.ai-tick b{font-variant-numeric:tabular-nums;font-weight:900}
.ai-tick .spark-mini{width:26px;height:10px;flex:none;opacity:.8}

/* ===== Variant B: baris ringkas icon + count ===== */
/* Variant B — inline, berdenyut bila ada aktiviti */
.ai-tick.b{background:none;border:0;padding:0;color:var(--muted);font-size:9px;gap:4px}
.ai-tick.b b{color:var(--blue);font-variant-numeric:tabular-nums}
.ai-tick.b .d{display:none}
.ai-tick.b svg{color:var(--blue);opacity:.85}
/* denyut penuh: hanya bila n>0 */
.ai-tick.b.live .ico{display:inline-flex;animation:bPulse 1.8s ease-in-out infinite}
@keyframes bPulse{
 0%,100%{opacity:.55;transform:scale(.92)}
 50%{opacity:1;transform:scale(1.12);filter:drop-shadow(0 0 6px #8ab4ffcc)}}
.ai-tick.b.live b{animation:bCount 1.8s ease-in-out infinite}
@keyframes bCount{0%,100%{opacity:.7}50%{opacity:1;text-shadow:0 0 8px #8ab4ff99}}
/* dot kecil berdenyut selepas count */
.ai-tick.b.live::after{content:"";width:3.5px;height:3.5px;border-radius:50%;background:#8ab4ff;
 box-shadow:0 0 6px #8ab4ff;animation:bDot 1.8s ease-in-out infinite;margin-left:1px}
@keyframes bDot{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.35)}}
/* idle (n=0): statik, redup */
.ai-tick.b.idle{opacity:.55}
@media(prefers-reduced-motion:reduce){
 .ai-tick.b.live .ico,.ai-tick.b.live b,.ai-tick.b.live::after{animation:none!important}
 .ai-tick.b.live .ico{opacity:1;transform:none}}

/* ===== Variant C: corner badge ===== */
.ai-tick.c{position:absolute;top:8px;right:8px;background:#8ab4ff14;border-color:#8ab4ff3d;z-index:3}
.pair.has-c{padding-top:11px}

/* ===== Variant D: meter bar ===== */
.ai-meter{display:flex;flex-direction:column;gap:3px;width:100%}
.ai-meter .lab{display:flex;justify-content:space-between;font-size:8px;font-weight:800;
 letter-spacing:.05em;color:var(--muted)}
.ai-meter .lab b{color:var(--blue);font-variant-numeric:tabular-nums}
.ai-meter .bar{height:3px;border-radius:99px;background:#8ab4ff1a;overflow:hidden}
.ai-meter .bar i{display:block;height:100%;border-radius:99px;
 background:linear-gradient(90deg,#8ab4ff,#d6ff9a);transition:width .6s cubic-bezier(.2,.9,.2,1)}

.foot{max-width:520px;margin:24px auto 0;color:var(--muted);font-size:10.5px;text-align:center;line-height:1.7}
.foot b{color:var(--lime)}
</style>
</head>
<body>
<h1>✦ Pair Card — AI Requests / hour</h1>
<p class="sub">Ticker berapa kali AI analyst diminta untuk pair itu dalam 1 jam terakhir.</p>

<div class="variants">
  <button class="vbtn on" data-v="a">A · Chip</button>
  <button class="vbtn" data-v="b">B · Inline</button>
  <button class="vbtn" data-v="c">C · Corner</button>
  <button class="vbtn" data-v="d">D · Meter</button>
</div>

<div class="grid" id="grid"></div>
<p class="foot">Klik atas untuk tukar variasi. Data sebenar dari <b>state/llm-analysis-log.jsonl</b> (1 jam terakhir).</p>

<script>
/* ===== data contoh (simulasi 1 jam) ===== */
var PAIRS=[
 {s:'XAUUSD',n:'Gold / US Dollar',px:'3534.88',ch:-0.12,closed:true,traders:1,ai:0,hist:[3,0,0,1,0]},
 {s:'XAGUSD',n:'Silver / US Dollar',px:'41.181',ch:-0.20,closed:true,traders:1,ai:0,hist:[1,0,0,0,0]},
 {s:'BTCUSD',n:'Bitcoin',px:'61136.07',ch:+2.06,traders:3,ai:14,hist:[1,2,0,3,4,2,2]},
 {s:'EURUSD',n:'Euro / US Dollar',px:'1.0965',ch:-0.05,closed:true,traders:0,ai:0,hist:[0,0,0,0,0]},
 {s:'GBPUSD',n:'Pound / US Dollar',px:'1.2712',ch:-0.08,closed:true,traders:0,ai:0,hist:[0,0,0,0]},
 {s:'USDJPY',n:'US Dollar / Yen',px:'151.32',ch:+0.14,closed:true,traders:1,ai:3,hist:[0,1,1,0,1]}
];

function sparkSVG(vals,w,h,color){
  if(!vals.length)return '';
  var mn=Math.min.apply(0,vals),mx=Math.max.apply(0,vals),rng=(mx-mn)||1;
  var pts=vals.map(function(v,i){
    var x=(i/(vals.length-1||1))*w, y=h-((v-mn)/rng)*(h-3)-1.5;
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  return '<svg class="spark-mini" viewBox="0 0 '+w+' '+h+'"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function aiIcon(sz){
  return '<svg width="'+(sz||9)+'" height="'+(sz||9)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="4"/></svg>';
}
var MODE='a';

function tickHTML(p){
  var n=p.ai||0;
  if(MODE==='a'){
    return '<span class="ai-tick"><span class="d"></span>'+aiIcon(8)+'<b>'+n+'</b>'+(n?'/h':'')+
      (n?sparkSVG(p.hist,26,10,'#8ab4ff'):'')+'</span>';
  }
  if(MODE==='b'){
    var live = n>0 ? ' live':' idle';
    return '<span class="ai-tick b'+live+'">'+
      '<span class="ico">'+aiIcon(10)+'</span>'+
      '<b>'+n+'</b><span>Requests this hour</span></span>';
  }
  if(MODE==='c'){
    return '<span class="ai-tick c"><span class="d"></span>'+aiIcon(8)+'<b>'+n+'</b></span>';
  }
  /* D meter: skala 0..20 */
  var pct=Math.max(0,Math.min(100,(n/20)*100));
  return '<div class="ai-meter"><div class="lab"><span>AI / HOUR</span><b>'+n+'</b></div>'+
    '<div class="bar"><i style="width:'+pct.toFixed(0)+'%"></i></div></div>';
}

function render(){
  var g=document.getElementById('grid');
  g.innerHTML=PAIRS.map(function(p){
    var up=p.ch>=0;
    var ch=p.closed?'<span class="closed-tag">MARKET CLOSED</span>'
      :'<span class="'+(up?'up':'dn')+'">'+(up?'▲ +':'▼ ')+p.ch.toFixed(2)+'%</span>';
    var traders=p.traders?'<span class="traders">🔥 '+p.traders+' trader'+(p.traders>1?'s':'')+'</span>':'';
    var main = MODE==='d' ? tickHTML(p) : '';   /* meter di bawah */
    var topTick = (MODE==='a'||MODE==='b') ? tickHTML(p) : '';
    return '<div class="pair'+(p.closed?' closed':'')+(MODE==='c'?' has-c':'')+'">'+
      (MODE==='c'?tickHTML(p):'')+
      '<div class="top"><span class="ic">'+p.s.slice(0,3)+'</span>'+
        '<svg class="spark" viewBox="0 0 62 22"><polyline points="'+
          p.hist.map(function(v,i){var mn=Math.min.apply(0,p.hist),mx=Math.max.apply(0,p.hist),rg=(mx-mn)||1;
          return (i/(p.hist.length-1||1))*62+','+(22-((v-mn)/rg)*18-2)}).join(' ')+
          '" fill="none" stroke="'+(up?'#b7f36b':'#ff777d')+'" stroke-width="1.5" stroke-linecap="round"/></svg>'+
      '</div>'+
      '<div class="nm">'+p.s+'</div><div class="ds">'+p.n+'</div>'+
      '<div class="px">'+p.px+'</div><div class="ch">'+ch+'</div>'+
      (MODE==='d'?main:'')+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+
        (MODE==='a'||MODE==='b'?topTick:'')+traders+
      '</div>'+
    '</div>';
  }).join('');
}

document.querySelectorAll('.vbtn').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.vbtn').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');MODE=b.dataset.v;render();
  };
});
render();
</script>
</body>
</html>
