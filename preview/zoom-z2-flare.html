<!doctype html><html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z2 — Lens Flare Burst</title>
<style>
:root{--lime:#b7f36b;--card:#111612;--card2:#171e18;--line:#222b23;--muted:#8a978c;--text:#eef3ee;--onlime:#10150b}
*{box-sizing:border-box;margin:0}
body{background:#0a0e0b;color:var(--text);font:14px -apple-system,sans-serif}
.hint{position:fixed;top:0;left:0;right:0;z-index:999;background:#171e18dd;color:var(--muted);font-size:10.5px;padding:8px 14px;text-align:center;border-bottom:1px solid var(--line)}
.hint b{color:var(--lime)}
.replay{position:fixed;bottom:14px;right:14px;z-index:999;background:var(--card2);border:1px solid var(--line);color:var(--lime);font:700 10px inherit;padding:8px 14px;border-radius:99px;cursor:pointer}
.phone{width:390px;max-width:100%;height:800px;max-height:100vh;margin:0 auto;position:relative;overflow:hidden;background:#050807}
#intro{position:absolute;inset:0;z-index:10;display:grid;place-items:center;cursor:pointer;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#0e150f,#030604 75%)}
.brand{position:absolute;top:60px;font-size:12px;font-weight:900;letter-spacing:2px;color:var(--lime);z-index:7;transition:opacity .25s}
.brand span{color:var(--text)}
.bh{position:relative;width:230px;height:230px;display:grid;place-items:center;z-index:4}
.bh .glow{position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#b7f36b33,transparent 65%);animation:gp 3s ease-in-out infinite}
@keyframes gp{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.1);opacity:1}}
.bh .core{position:relative;width:76px;height:76px;border-radius:50%;background:#000;z-index:6;
 box-shadow:0 0 0 2px var(--lime),0 0 36px 12px #b7f36baa,0 0 100px 36px #b7f36b44;animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.bh .ring{position:absolute;width:110px;height:110px;border-radius:50%;border:1px solid #b7f36b99;animation:wv 3s ease-out infinite}
.bh .ring.b{animation-delay:1s}.bh .ring.c{animation-delay:2s}
@keyframes wv{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.4);opacity:0}}
.itxt{position:absolute;bottom:140px;text-align:center;z-index:7;padding:0 30px;transition:opacity .2s,transform .4s}
.itxt b{display:block;font-size:24px;font-weight:900}.itxt small{display:block;color:var(--muted);font-size:11.5px;margin-top:8px}
.tap{position:absolute;bottom:44px;font-size:10.5px;color:var(--lime);font-weight:800;letter-spacing:1px;animation:bl 1.6s infinite;z-index:7}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
/* FLARE layers */
.flare{position:absolute;left:50%;top:50%;z-index:8;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}
.flare .burst{position:absolute;left:50%;top:50%;width:4px;height:340px;transform-origin:50% 0;
 background:linear-gradient(180deg,#fff,#b7f36b 30%,transparent);filter:blur(1px)}
.flare .ray{position:absolute;left:50%;top:50%;width:100%;height:100%;transform-origin:0 0}
/* chroma rings masa zoom */
.chroma{position:absolute;left:50%;top:50%;width:120px;height:120px;border-radius:50%;border:3px solid;z-index:6;
 opacity:0;transform:translate(-50%,-50%);pointer-events:none}
.chroma.c1{border-color:#ff4d6d}.chroma.c2{border-color:#4dd2ff}
/* zoom seq */
#intro.flash{background:#eaffd6}

@keyframes bhZoom{0%{transform:scale(1)}30%{transform:scale(1.5)}65%{transform:scale(4)}100%{transform:scale(18)}}
#intro.go .brand,#intro.go .tap{opacity:0}
#intro.go .itxt{opacity:0;transform:scale(1.2);filter:blur(6px)}
#intro.go .flare{opacity:1;animation:flareOut 1.3s ease-out forwards}
@keyframes flareOut{0%{transform:translate(-50%,-50%) scale(.1) rotate(0);opacity:1}60%{opacity:1}100%{transform:translate(-50%,-50%) scale(2.6) rotate(18deg);opacity:0}}
#intro.go .flare .burst{animation:rayLen .9s ease-out forwards}
@keyframes rayLen{0%{height:0}50%{height:400px}100%{height:120px}}
#intro.go .chroma.c1{animation:chromaOut .8s ease-out forwards}
#intro.go .chroma.c2{animation:chromaOut .8s ease-out .06s forwards}
@keyframes chromaOut{0%{transform:translate(-50%,-50%) scale(1);opacity:.9}100%{transform:translate(-50%,-50%) scale(7);opacity:0}}
#void{position:absolute;inset:0;z-index:15;background:#fff;opacity:0;transition:opacity .18s}
#void.on{opacity:1}
#on{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(4,8,5,.92);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .45s}
#on.show{opacity:1;pointer-events:auto}
.card{width:100%;max-width:360px;background:var(--card);border:1px solid #b7f36b3d;border-radius:24px;padding:24px 20px 18px;text-align:center;transform:scale(.9);transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
#on.show .card{transform:scale(1)}
.clogo{font-size:12px;font-weight:900;color:var(--lime);margin-bottom:14px}.clogo span{color:var(--text)}
.mini{width:62px;height:62px;margin:0 auto 14px;border-radius:50%;background:#000;box-shadow:0 0 0 1.5px var(--lime),0 0 18px 5px #b7f36b77}
.ct{font-size:20px;font-weight:900}.cs{font-size:11px;color:var(--muted);margin:6px 0 18px}
.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px;color:var(--text);font:inherit;cursor:pointer}
.oi{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:#b7f36b18;color:var(--lime)}
.ot{flex:1;display:flex;flex-direction:column;gap:2px}.ot b{font-size:12px;font-weight:800}.ot small{font-size:9.5px;color:var(--muted)}
.go{width:100%;border:0;border-radius:13px;padding:13px;font:800 12.5px inherit;cursor:pointer;background:linear-gradient(135deg,var(--lime),#8ed94e);color:var(--onlime);margin-top:7px}
.sk{display:block;margin:10px auto 0;border:0;background:none;color:var(--muted);cursor:pointer;font:600 10.5px inherit;text-decoration:underline}
#intro.go .bh{transform:none}}
</style></head><body>
<div class="hint"><b>Z2 Lens Flare Burst</b> — white flash + chroma split + ular cahaya. 🔊 Bunyi "shimmer + impact"</div>
<button class="replay" onclick="location.reload()">↻ Replay</button>
<div class="phone">
 <div id="intro">
  <div class="brand">✦ <span>TraderWatch</span></div>
  <div class="bh" id="bh"><div class="glow"></div><div class="ring"></div><div class="ring b"></div><div class="ring c"></div><div class="core"></div></div>
  <div class="flare" id="flare"></div>
  <div class="chroma c1"></div><div class="chroma c2"></div>
  <div class="itxt"><b>Burst into insight.</b><small>Satu tekan, terus ke dalam data.</small></div>
  <div class="tap">TEKAN UNTUK MASUK →</div>
 </div>
 <div id="void"></div>
 <div id="on"><div class="card">
  <div class="clogo">✦ <span>TraderWatch</span></div><div class="mini"></div>
  <div class="ct">Selamat datang!</div><div class="cs">Sediakan app anda sebelum mula.</div>
  <button class="opt"><span class="oi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/></svg></span><span class="ot"><b>Hidupkan notifikasi</b><small>Alert TP/SL</small></span></button>
  <button class="opt"><span class="oi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/></svg></span><span class="ot"><b>Tambah ke skrin utama</b><small>Buka macam app</small></span></button>
  <button class="go">Mula trade →</button><button class="sk">Langkau dulu</button>
 </div></div>
</div>
<script>
var AC=null;function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function flareSound(){
 var c=ac(),t=c.currentTime;
 /* rising shimmer: 3 detuned sines sweep up */
 [0,7,12].forEach(function(off,i){
  var o=c.createOscillator();o.type='triangle';
  var base=440*Math.pow(2,off/12);
  o.frequency.setValueAtTime(base,t);o.frequency.exponentialRampToValueAtTime(base*4,t+.55);
  var g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.1+i*.03);g.gain.exponentialRampToValueAtTime(.001,t+.75);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+.8);
 });
 /* bright noise burst */
 var n=c.createBufferSource(),b=c.createBuffer(1,c.sampleRate*.5,c.sampleRate),d=b.getChannelData(0);
 for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=b;
 var hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=2000;
 var ng=c.createGain();ng.gain.setValueAtTime(.2,t);ng.gain.exponentialRampToValueAtTime(.001,t+.4);
 n.connect(hp).connect(ng).connect(c.destination);n.start(t);n.stop(t+.5);
 /* impact at flash */
 var o2=c.createOscillator();o2.type='square';o2.frequency.setValueAtTime(180,t+.6);o2.frequency.exponentialRampToValueAtTime(40,t+.9);
 var g2=c.createGain();g2.gain.setValueAtTime(.0001,t+.6);g2.gain.exponentialRampToValueAtTime(.3,t+.63);g2.gain.exponentialRampToValueAtTime(.001,t+1);
 o2.connect(g2).connect(c.destination);o2.start(t+.6);o2.stop(t+1.05);
}

/* ===== JS-DRIVEN ZOOM (bukan CSS animation — works even with Reduce Motion) ===== */
function jsZoom(el,max,dur,onDone){
 var t0=null;
 function step(ts){
  if(t0===null)t0=ts;
  var p=Math.min(1,(ts-t0)/dur);
  var e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  var sc=1+e*(max-1);
  el.style.transform='scale('+sc.toFixed(3)+')';
  if(p<1)requestAnimationFrame(step);else if(onDone)onDone();
 }
 requestAnimationFrame(step);
}
(function(){
 var f=document.getElementById('flare');
 for(var i=0;i<16;i++){var r=document.createElement('div');r.className='ray';
  var b=document.createElement('div');b.className='burst';
  b.style.transform='rotate('+(i*22.5).toFixed(1)+'deg)';
  b.style.opacity=(0.4+Math.random()*0.6).toFixed(2);
  r.appendChild(b);f.appendChild(r)}
 var intro=document.getElementById('intro'),busy=false;
 intro.onclick=function(){
  if(busy)return;busy=true;
  try{flareSound}catch(e){}
  intro.classList.add('go');
  var zoomEl=document.querySelector('.bh');
  jsZoom(zoomEl,18,1600,function(){
   document.getElementById('void').classList.add('on');
   setTimeout(function(){
    intro.style.display='none';
    document.getElementById('on').classList.add('show');
    setTimeout(function(){var v=document.getElementById('void');v.style.transition='opacity .6s';v.classList.remove('on')},120);
   },260);
  });
 };
})();
</script></body></html>
