<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraderWatch — Earth globe test</title>
<style>
:root{--bg:#090c0a;--lime:#c6f36b;--cyan:#35e0f0;--ink:#f2f5ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;
  display:grid;place-items:center;min-height:100vh}
.stage{position:relative;width:336px;height:336px}
canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;
  box-shadow:0 0 0 1px #2a3a2e, 0 0 70px #7bff0022 inset}
.tag{position:absolute;bottom:-38px;width:100%;text-align:center;font-size:11px;
  letter-spacing:.14em;color:#8b9a8f;font-weight:700}
</style>
</head>
<body>
<div class="stage"><canvas id="c" width="672" height="672"></canvas>
<div class="tag">TW EARTH TEST</div></div>

<script src="globe-land.js"></script>
<script>
(function(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var W=cv.width, H=cv.height, R=W/2;
  var LAND=window.TW_LAND;
  if(!LAND){document.querySelector('.tag').textContent='LANDMASK MISSING';return;}

  // Build the point cloud once: every land cell becomes a 3D unit vector.
  // Stored flat for speed - no per-frame allocation.
  var pts=[];
  for(var r=0;r<LAND.h;r++){
    var runs=LAND.rows[r];
    var lat=90-(r+0.5)*LAND.res;
    for(var k=0;k<runs.length;k++){
      var start=runs[k][0], len=runs[k][1];
      for(var c=start;c<start+len;c++){
        var lon=-180+(c+0.5)*LAND.res;
        var phi=(90-lat)*Math.PI/180, the=(lon+180)*Math.PI/180;
        pts.push(Math.sin(phi)*Math.cos(the), Math.cos(phi), Math.sin(phi)*Math.sin(the));
      }
    }
  }

  // Visitor sites. Continent keys drive the per-continent blink.
  var SITES=[
    {c:'Malaysia',   lat:3.14,  lon:101.69, cont:'AS', v:450},
    {c:'United States', lat:38.9, lon:-77.04, cont:'NA', v:220},
    {c:'Netherlands',lat:52.37, lon:4.9,    cont:'EU', v:150},
    {c:'Canada',     lat:45.42, lon:-75.7,  cont:'NA', v:80},
    {c:'Taiwan',     lat:25.03, lon:121.56, cont:'AS', v:60},
    {c:'Indonesia',  lat:-6.21, lon:106.85, cont:'AS', v:50},
    {c:'Italy',      lat:41.9,  lon:12.5,   cont:'EU', v:40},
    {c:'Australia',  lat:-33.87,lon:151.21, cont:'OC', v:30},
    {c:'Switzerland',lat:46.95, lon:7.45,   cont:'EU', v:30},
    {c:'Singapore',  lat:1.35,  lon:103.82, cont:'AS', v:30}
  ];

  // Which continent each land point belongs to, by lon/lat box. Used to tint
  // the region that has visitors and to make it pulse.
  function continent(lat,lon){
    if(lat>35 && lon>-25 && lon<45)  return 'EU';
    if(lat>60 && lon>45)             return 'AS';
    if(lat<12 && lon>95 && lon<155)  return 'OC';
    if(lat>12 && lon>-170 && lon<-50)return 'NA';
    if(lat<12 && lon>-85 && lon<-30) return 'SA';
    if(lat>-37 && lat<37 && lon>-20 && lon<52) return 'AF';
    if(lat>12 && lon>-170 && lon<-50)return 'NA';
    return 'XX';
  }
  var ACTIVE={}; SITES.forEach(function(s){ACTIVE[s.cont]=true});

  var cont=new Array(pts.length/3);
  for(var i=0;i<cont.length;i++){
    var phi=Math.acos(Math.max(-1,Math.min(1,pts[i*3+1])));
    var lat=90-phi*180/Math.PI;
    var lon=Math.atan2(pts[i*3+2], pts[i*3])*180/Math.PI;
    cont[i]=continent(lat,lon);
  }

  var px=new Float32Array(cont.length), py=new Float32Array(cont.length),
      pz=new Float32Array(cont.length);

  function draw(t){
    var rot=t/1000*0.16, ct=Math.cos(rot), st=Math.sin(rot);
    ctx.clearRect(0,0,W,H);

    // soft globe body
    var g=ctx.createRadialGradient(R*0.7,R*0.66,R*0.1,R,R,R*1.02);
    g.addColorStop(0,'#121a14'); g.addColorStop(.72,'#0c120e'); g.addColorStop(1,'#070a08');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(R,R,R*0.985,0,6.283); ctx.fill();

    // pulse phase: slow 3.2s wave so the active continents breathe
    var pulse=0.5+0.5*Math.sin(t/1000*1.969);

    for(var i=0;i<cont.length;i++){
      var x0=pts[i*3], y0=pts[i*3+1], z0=pts[i*3+2];
      // rotate around Y axis (spin around the poles, not the camera)
      var x=x0*ct+z0*st, z=-x0*st+z0*ct;
      if(z<0.02) continue;
      px[i]=R+x*R*0.96; py[i]=R-y0*R*0.96; pz[i]=z;
    }

    // water dots (faint), then land
    for(var i=0;i<cont.length;i++){
      var z=pz[i]; if(z<=0) continue;
      var active=ACTIVE[cont[i]];
      var a=Math.min(1,z*1.6)*0.72, s=1.55*(0.42+z*0.85);
      if(active){
        a*=0.62+0.38*pulse;
        s*=1.0+0.32*pulse;
        ctx.fillStyle='rgba(120,255,170,'+(a*0.96).toFixed(3)+')';
      }else{
        ctx.fillStyle='rgba(150,190,160,'+(a*0.44).toFixed(3)+')';
      }
      ctx.beginPath(); ctx.arc(px[i],py[i],s,0,6.283); ctx.fill();
    }

    // rim light
    ctx.strokeStyle='rgba(198,243,107,.20)'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.arc(R,R,R*0.985,0,6.283); ctx.stroke();

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
